submission:
  title: ""                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                
    Defense analysts and commanders face severe alert fatigue from thousands of fragmented SIEM, satellite, 
    and cyber feeds daily, where chasing false positives drains resources and missing a real threat is catastrophic. 
    Our project solves this by automatically filtering noise, correlating cross-domain alerts to the MITRE ATT&CK 
    framework, and generating rapid BLUF (Bottom Line Up Front) briefings so leadership can make decisive defense 
    decisions in minutes.

  solution_summary: >                  
    We built Project BOB, an automated defense intelligence platform that unifies multi-domain feeds across SIEM logs, 
    satellite sensors, and cyber telemetry into a single tactical command dashboard. 
    It works through a cross-domain correlation engine that eliminates over 85% of false-positive noise, maps attack 
    chains to the MITRE ATT&CK framework, and instantly generates structured BLUF (Bottom Line Up Front) briefings for 
    rapid commander decision-making.

  key_features:                      
    - "Multi-Domain Ingestion & Correlation: Unifies SIEM logs, satellite RF telemetry, cyber sensors, 
      and STIX feeds into single coordinated threat clusters."                     
    - "85%+ Heuristic Noise Reduction: Automatically filters out benign scanner sweeps and sensor 
      calibrations to isolate genuine adversary activity."
    - "Real-Time MITRE ATT&CK Mapping: Maps detected tactics across 14 enterprise and space/electronic 
      warfare domains with live technique heatmaps."
    - "Automated Commander BLUF Briefings: Instantly synthesizes complex attack chains into structured, 
      executive summaries with prioritized rules of engagement."                             
    - "Tactical Command HUD: Delivers a dark glassmorphism dashboard featuring live canvas radar tracking 
      and defense-grade anti-exploit hardening."                      

  tech_stack:
    languages: [Python, JavaScript (ES6+), HTML5, CSS3]                     
    frameworks: [FastAPI, Uvicorn, Pydantic, Starlette]                    
    ibm_technologies: [PostgreSQL, In-Memory Cache]              
    databases: [IBM watsonx.ai, IBM QRadar SIEM integration]                      
    other: [MITRE ATT&CK Matrix, STIX 2.1, HTML5 Canvas API, RESTful APIs, PBKDF2-SHA256]                         
    
  what_we_are_most_proud_of: >        
    The core strength of our submission is our Cross-Domain Correlation and BLUF Generation Engine. 
    It is the only solution that unifies Space/Satellite electronic warfare with ground cyber telemetry, 
    cuts 85% of alert noise, and instantly translates complex attack chains into structured, decision-ready 
    briefings that military commanders can act on in minutes.

  known_limitations: >                 
    - In-Memory Alert Storage & State Persistence
    - Heuristic Rule-Based Correlation vs. Advanced ML
    - Dependency on Cloud / External LLMs for Enhanced BLUF Synthesis
